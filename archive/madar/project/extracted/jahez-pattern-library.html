/* Colors — calibrated against the reference images (Nati wallet, Maze, AI Edge,
 * EigenExplorer, Choose-plan, Wallet steps).
 *
 * Two layers:
 *   1. Palette  — raw scales. Never used directly by components.
 *   2. Semantic — what components actually reference.
 *
 * Key principle: BRIGHT FLAT BRAND, not gradient mesh. The bright sky blue
 * is the headline color. Squircle accents are saturated and used liberally.
 */

:root {
  /* ──────────────────────────────────────────────────────────────
   * NEUTRALS — Warm cream
   * Page sits on a warm off-grey (Nati wallet outer container).
   * Cards on the page are pure white.
   * ────────────────────────────────────────────────────────────── */
  --cream-0:    #FFFFFF;
  --cream-25:   #FBFAF7;
  --cream-50:   #F4F2EC;    /* warm card-on-cream */
  --cream-100:  #EBEAE6;    /* page background (Nati wallet outer frame) */
  --cream-150:  #DEDCD6;    /* sunken surfaces, ghost orbs */
  --cream-200:  #C9C6BD;    /* hairline border on cream */
  --cream-300:  #A8A5A0;
  --cream-400:  #79766F;
  --cream-500:  #5B5853;    /* secondary text */
  --cream-600:  #3F3D38;
  --cream-700:  #29272A;
  --cream-800:  #1A1916;
  --cream-900:  #0A0A09;    /* primary text */
  --ink:        #0A0A0B;    /* deep black for primary pill */
  --ink-soft:   #1A1A1D;    /* raised dark surface */

  /* ──────────────────────────────────────────────────────────────
   * BRAND — Bright Sky Blue (Nati wallet hero)
   * Flat, vivid, used as a solid fill (not a mesh).
   * The 500 is the canonical brand.
   * ────────────────────────────────────────────────────────────── */
  --sky-50:   #EAF4FF;
  --sky-100:  #CCE3FF;
  --sky-200:  #99C7FF;
  --sky-300:  #66ACFF;
  --sky-400:  #3D95FF;
  --sky-500:  #1E88FF;     /* canonical brand */
  --sky-600:  #1670E0;
  --sky-700:  #0E58B4;
  --sky-800:  #0B438A;
  --sky-900:  #082C5C;

  /* Brand fill — used directly on HeroCard.
     A nearly-flat sky with a barely-visible radial highlight,
     not a 4-stop mesh. */
  --brand-fill: radial-gradient(120% 80% at 30% 20%,
                  #4FA3FF 0%,
                  #1E88FF 55%,
                  #1670E0 100%);

  /* Brand halo — the glow that bleeds below a HeroCard onto the floor. */
  --brand-halo: 0 30px 80px rgba(30, 136, 255, 0.45);

  /* ──────────────────────────────────────────────────────────────
   * SQUIRCLE ACCENT PALETTE — the Maze-pattern icon container colors.
   * Each comes with a -fill (the saturated body), -shadow (colored ambient),
   * and -tint (a soft light bg for that color, used on selected rows).
   * ────────────────────────────────────────────────────────────── */

  /* Orange */
  --sq-orange-fill:   linear-gradient(180deg, #FF8A4A 0%, #F36A1F 100%);
  --sq-orange-shadow: 0 4px 10px rgba(243, 106, 31, 0.35);
  --sq-orange-tint:   #FFEFE3;

  /* Green */
  --sq-green-fill:    linear-gradient(180deg, #2DCB7E 0%, #15976A 100%);
  --sq-green-shadow:  0 4px 10px rgba(21, 151, 106, 0.35);
  --sq-green-tint:    #E2F7EC;

  /* Blue (matches brand) */
  --sq-blue-fill:     linear-gradient(180deg, #4FA3FF 0%, #1670E0 100%);
  --sq-blue-shadow:   0 4px 10px rgba(22, 112, 224, 0.35);
  --sq-blue-tint:     #E4F0FF;

  /* Purple */
  --sq-purple-fill:   linear-gradient(180deg, #B287FF 0%, #7C4DFF 100%);
  --sq-purple-shadow: 0 4px 10px rgba(124, 77, 255, 0.35);
  --sq-purple-tint:   #EFE7FF;

  /* Pink */
  --sq-pink-fill:     linear-gradient(180deg, #FF6EB4 0%, #E13E8C 100%);
  --sq-pink-shadow:   0 4px 10px rgba(225, 62, 140, 0.35);
  --sq-pink-tint:     #FFE4F0;

  /* Amber (warning) */
  --sq-amber-fill:    linear-gradient(180deg, #FFCC4D 0%, #E89A0C 100%);
  --sq-amber-shadow:  0 4px 10px rgba(232, 154, 12, 0.35);
  --sq-amber-tint:    #FFF3D6;

  /* Red (danger) */
  --sq-red-fill:      linear-gradient(180deg, #FF6B5C 0%, #E2382B 100%);
  --sq-red-shadow:    0 4px 10px rgba(226, 56, 43, 0.35);
  --sq-red-tint:      #FFE2DE;

  /* Teal */
  --sq-teal-fill:     linear-gradient(180deg, #3DD9D9 0%, #0FA3A3 100%);
  --sq-teal-shadow:   0 4px 10px rgba(15, 163, 163, 0.35);
  --sq-teal-tint:     #DDF6F6;

  /* Ink (neutral dark — for "more" actions) */
  --sq-ink-fill:      linear-gradient(180deg, #3C3C3F 0%, #0A0A0B 100%);
  --sq-ink-shadow:    0 4px 10px rgba(10, 10, 11, 0.40);
  --sq-ink-tint:      var(--cream-100);

  /* Silver (neutral light — for inactive plan orbs etc.) */
  --sq-silver-fill:   linear-gradient(180deg, #F4F2EC 0%, #C9C6BD 100%);
  --sq-silver-shadow: 0 4px 10px rgba(46, 44, 39, 0.18);
  --sq-silver-tint:   var(--cream-50);

  /* ──────────────────────────────────────────────────────────────
   * AVATAR RING BACKGROUNDS (Nati wallet style)
   * Soft pastel rings under the memoji circle.
   * ────────────────────────────────────────────────────────────── */
  --avatar-peach:    #FFD9C2;
  --avatar-mint:     #C8F0D6;
  --avatar-cream:    #F7E8C8;
  --avatar-tan:      #F0D8A8;
  --avatar-lavender: #DCD2FA;
  --avatar-pink:     #FFD0E1;
  --avatar-sky:      #C8DEFF;

  /* ──────────────────────────────────────────────────────────────
   * SEMANTIC palettes
   * ────────────────────────────────────────────────────────────── */

  /* Success — emerald */
  --success-50:  #E8F8EF;
  --success-100: #C8EFD5;
  --success-500: #15B66A;
  --success-600: #0F9354;
  --success-700: #0A6F40;

  /* Warning — amber */
  --warning-50:  #FFF6E5;
  --warning-100: #FFE6B3;
  --warning-500: #F0A521;
  --warning-600: #C8830C;
  --warning-700: #9A6308;

  /* Danger — red */
  --danger-50:  #FFEEEC;
  --danger-100: #FFD2CC;
  --danger-500: #EF4438;
  --danger-600: #D02D23;
  --danger-700: #A01F18;

  /* Info — cyan */
  --info-50:  #E5F6FF;
  --info-100: #B8E5FF;
  --info-500: #1AA7F0;
  --info-600: #0E83C0;
  --info-700: #0A6294;


  /* ══════════════════════════════════════════════════════════════
   * SEMANTIC ALIASES
   * ══════════════════════════════════════════════════════════════ */

  /* Surfaces */
  --surface-page:      var(--cream-100);   /* warm off-grey (Nati outer frame) */
  --surface-frame:     var(--cream-50);    /* outer card frame */
  --surface-card:      var(--cream-0);     /* pure white inner card */
  --surface-raised:    var(--cream-25);
  --surface-sunken:    var(--cream-150);
  --surface-overlay:   var(--cream-0);
  --surface-inverse:   var(--ink);
  --surface-inverse-raised: var(--ink-soft);
  --surface-brand:     var(--sky-500);

  /* Text */
  --text-primary:    var(--cream-900);
  --text-secondary:  var(--cream-500);
  --text-tertiary:   var(--cream-400);
  --text-disabled:   var(--cream-300);
  --text-inverse:    var(--cream-0);
  --text-inverse-secondary: rgba(255, 255, 255, 0.72);
  --text-brand:      var(--sky-600);
  --text-link:       var(--sky-600);

  /* Borders */
  --border-subtle:   rgba(10, 10, 9, 0.06);
  --border-default:  rgba(10, 10, 9, 0.08);
  --border-strong:   rgba(10, 10, 9, 0.12);
  --border-focus:    var(--sky-500);
  --border-brand:    var(--sky-500);
  --border-on-dark:  rgba(255, 255, 255, 0.12);

  /* Order lifecycle states — squircle tones (string keys, not values) */
  --state-draft-tone:     silver; /* @kind other */
  --state-pending-tone:   amber;  /* @kind other */
  --state-preparing-tone: blue;   /* @kind other */
  --state-prepared-tone:  green;  /* @kind other */
  --state-archived-tone:  ink;    /* @kind other */

  /* Order lifecycle pill bg/fg */
  --state-draft-bg:        var(--cream-150);
  --state-draft-fg:        var(--cream-700);
  --state-pending-bg:      var(--sq-amber-tint);
  --state-pending-fg:      var(--warning-700);
  --state-preparing-bg:    var(--sq-blue-tint);
  --state-preparing-fg:    var(--sky-700);
  --state-prepared-bg:     var(--sq-green-tint);
  --state-prepared-fg:     var(--success-700);
  --state-archived-bg:     var(--cream-150);
  --state-archived-fg:     var(--cream-500);

  /* Payment states */
  --pay-unpaid-fg:    var(--danger-700);
  --pay-unpaid-bg:    var(--sq-red-tint);
  --pay-partial-fg:   var(--warning-700);
  --pay-partial-bg:   var(--sq-amber-tint);
  --pay-paid-fg:      var(--success-700);
  --pay-paid-bg:      var(--sq-green-tint);
  --pay-pending-fg:   var(--info-700);
  --pay-pending-bg:   var(--sq-blue-tint);

  /* Feedback */
  --feedback-success-fg:    var(--success-700);
  --feedback-success-bg:    var(--success-50);
  --feedback-success-border: var(--success-100);

  --feedback-warning-fg:    var(--warning-700);
  --feedback-warning-bg:    var(--warning-50);
  --feedback-warning-border: var(--warning-100);

  --feedback-danger-fg:     var(--danger-700);
  --feedback-danger-bg:     var(--danger-50);
  --feedback-danger-border: var(--danger-100);

  --feedback-info-fg:       var(--info-700);
  --feedback-info-bg:       var(--info-50);
  --feedback-info-border:   var(--info-100);

  /* Profit colors */
  --profit-positive: var(--success-600);
  --profit-neutral:  var(--cream-500);
  --profit-negative: var(--danger-600);

  /* Chart palette */
  --chart-1: var(--sky-500);
  --chart-2: var(--success-500);
  --chart-3: var(--warning-500);
  --chart-4: #7C4DFF;
  --chart-5: #E13E8C;
  --chart-6: var(--danger-500);

  /* Interactive tints */
  --hover-tint:     rgba(10, 10, 9, 0.04);
  --press-tint:     rgba(10, 10, 9, 0.08);
  --hover-on-dark:  rgba(255, 255, 255, 0.08);
  --press-on-dark:  rgba(255, 255, 255, 0.14);

  /* Focus ring */
  --focus-ring:        0 0 0 4px rgba(30, 136, 255, 0.22);
  --focus-ring-danger: 0 0 0 4px rgba(239, 68, 56, 0.22);
}

/* Typography — bold-sans-first, calibrated against references.
 *
 * THE BIG CHANGE FROM v1: huge numbers (KPI hero, balance) are now
 * BOLD SANS by default (Inter Tight 700, -0.03em). Serif (Instrument
 * Serif) stays available as an OPT-IN display class for editorial moments.
 *
 * Hierarchy: hero numbers > Arabic functional > Latin label > mono ID
 */

:root {
  /* Font families */
  --font-sans-en:    "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-sans:       "IBM Plex Sans Arabic", "Inter Tight", -apple-system, system-ui, sans-serif;
  --font-display:    "Inter Tight", "IBM Plex Sans Arabic", -apple-system, system-ui, sans-serif;
  --font-display-serif: "Instrument Serif", Georgia, serif;
  --font-mono:       "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* Weights */
  --fw-regular:  400; /* @kind font */
  --fw-medium:   500; /* @kind font */
  --fw-semibold: 600; /* @kind font */
  --fw-bold:     700; /* @kind font */

  /* ──────────────────────────────────────────────────────────────
   * Type scale — comfortable for Arabic, big enough for hero numbers
   * ────────────────────────────────────────────────────────────── */

  --text-display-3xl: 72px;
  --text-display-2xl: 56px;
  --text-display-xl:  44px;
  --text-display-lg:  36px;

  --text-h1: 28px;
  --text-h2: 22px;
  --text-h3: 18px;
  --text-h4: 16px;

  --text-body-lg: 16px;
  --text-body:    14px;
  --text-body-sm: 13px;
  --text-caption: 12px;
  --text-micro:   11px;

  /* Line heights — Arabic-tuned */
  --lh-tight:   1.05; /* @kind other */
  --lh-snug:    1.25; /* @kind other */
  --lh-normal:  1.55; /* @kind other */
  --lh-relaxed: 1.7;  /* @kind other */

  /* Letter-spacing */
  --ls-tighter: -0.035em; /* @kind other */
  --ls-tight:   -0.015em; /* @kind other */
  --ls-normal:  0;        /* @kind other */
  --ls-wide:    0.02em;   /* @kind other */
  --ls-caps:    0.06em;   /* @kind other */

  /* ──────────────────────────────────────────────────────────────
   * Composed text styles
   * Display = BOLD SANS by default. Use --type-display-serif-* for editorial.
   * ────────────────────────────────────────────────────────────── */

  --type-display-3xl: var(--fw-bold) var(--text-display-3xl) / var(--lh-tight) var(--font-display); /* @kind font */
  --type-display-2xl: var(--fw-bold) var(--text-display-2xl) / var(--lh-tight) var(--font-display); /* @kind font */
  --type-display-xl:  var(--fw-bold) var(--text-display-xl)  / var(--lh-tight) var(--font-display); /* @kind font */
  --type-display-lg:  var(--fw-bold) var(--text-display-lg)  / var(--lh-snug)  var(--font-display); /* @kind font */

  /* Serif display — OPT-IN for editorial moments */
  --type-display-serif-2xl: var(--fw-regular) var(--text-display-2xl) / var(--lh-tight) var(--font-display-serif); /* @kind font */
  --type-display-serif-xl:  var(--fw-regular) var(--text-display-xl)  / var(--lh-tight) var(--font-display-serif); /* @kind font */
  --type-display-serif-lg:  var(--fw-regular) var(--text-display-lg)  / var(--lh-snug)  var(--font-display-serif); /* @kind font */

  /* Mono display — for technical/financial-data screens (EigenExplorer pattern) */
  --type-display-mono-2xl: var(--fw-bold) var(--text-display-2xl) / var(--lh-tight) var(--font-mono); /* @kind font */
  --type-display-mono-xl:  var(--fw-bold) var(--text-display-xl)  / var(--lh-tight) var(--font-mono); /* @kind font */

  /* Headings */
  --type-h1: var(--fw-bold)     var(--text-h1) / var(--lh-snug) var(--font-sans); /* @kind font */
  --type-h2: var(--fw-semibold) var(--text-h2) / var(--lh-snug) var(--font-sans); /* @kind font */
  --type-h3: var(--fw-semibold) var(--text-h3) / var(--lh-snug) var(--font-sans); /* @kind font */
  --type-h4: var(--fw-semibold) var(--text-h4) / var(--lh-snug) var(--font-sans); /* @kind font */

  /* Body */
  --type-body-lg: var(--fw-regular) var(--text-body-lg) / var(--lh-normal) var(--font-sans); /* @kind font */
  --type-body:    var(--fw-regular) var(--text-body)    / var(--lh-normal) var(--font-sans); /* @kind font */
  --type-body-sm: var(--fw-regular) var(--text-body-sm) / var(--lh-normal) var(--font-sans); /* @kind font */
  --type-caption: var(--fw-medium)  var(--text-caption) / var(--lh-normal) var(--font-sans); /* @kind font */
  --type-micro:   var(--fw-medium)  var(--text-micro)   / var(--lh-normal) var(--font-sans); /* @kind font */

  --type-eyebrow: var(--fw-semibold) var(--text-micro) / var(--lh-normal) var(--font-sans-en); /* @kind font */

  --type-mono:    var(--fw-medium) var(--text-body) / var(--lh-normal) var(--font-mono); /* @kind font */
  --type-mono-lg: var(--fw-medium) var(--text-body-lg) / var(--lh-normal) var(--font-mono); /* @kind font */
}

.num,
.tabular {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* Editorial serif — opt-in via class */
.display-serif {
  font-family: var(--font-display-serif);
  font-weight: var(--fw-regular);
  letter-spacing: var(--ls-tight);
}

/* Spacing.
 *
 * 4px base. Components compose these, never raw px values.
 * Use semantic aliases (--gutter-*, --pad-*) when a token has a clear role.
 */

:root {
  --space-0:   0;
  --space-px:  1px;
  --space-0_5: 2px;
  --space-1:   4px;
  --space-1_5: 6px;
  --space-2:   8px;
  --space-2_5: 10px;
  --space-3:   12px;
  --space-3_5: 14px;
  --space-4:   16px;
  --space-5:   20px;
  --space-6:   24px;
  --space-7:   28px;
  --space-8:   32px;
  --space-10:  40px;
  --space-12:  48px;
  --space-14:  56px;
  --space-16:  64px;
  --space-20:  80px;
  --space-24:  96px;
  --space-32:  128px;

  /* Semantic aliases — common roles */
  --pad-card:        var(--space-5);      /* default card padding */
  --pad-card-lg:     var(--space-6);
  --pad-card-sm:     var(--space-4);
  --pad-input-x:     var(--space-3);
  --pad-input-y:     var(--space-2_5);
  --pad-button-x:    var(--space-4);
  --pad-button-y:    var(--space-2_5);

  --gutter-xs:       var(--space-2);
  --gutter-sm:       var(--space-3);
  --gutter-md:       var(--space-4);
  --gutter-lg:       var(--space-6);
  --gutter-xl:       var(--space-8);

  --stack-xs:        var(--space-1);
  --stack-sm:        var(--space-2);
  --stack-md:        var(--space-4);
  --stack-lg:        var(--space-6);
  --stack-xl:        var(--space-10);

  /* Layout */
  --sidebar-width:       260px;
  --sidebar-width-sm:    72px;   /* collapsed */
  --topbar-height:       60px;
  --container-max:       1280px;
  --container-narrow:    720px;
}

/* Corner radii — heavier, softer.
 *
 * Pushed up significantly from the previous scale.
 * Cards now sit at 24px (was 12px), hero surfaces at 32px (was 16px).
 * Buttons go full-pill by default.
 */

:root {
  --radius-none: 0;
  --radius-xs:    4px;
  --radius-sm:    8px;
  --radius-md:   12px;    /* inputs, small chips */
  --radius-lg:   18px;    /* small cards, dropdowns */
  --radius-xl:   24px;    /* default cards */
  --radius-2xl:  32px;    /* hero cards, sheets */
  --radius-3xl:  40px;    /* large hero surfaces, mobile sheet pulls */
  --radius-pill: 9999px;  /* buttons, pills, avatars */
  --radius-full: 9999px;  /* alias */
}

/* Elevation — "Liquid Soft" shadow system.
 *
 * Three flavors:
 *  - Soft drop shadows (ambient diffused, warm-tinted)
 *  - Inset highlights (suggest sculpted depth on raised surfaces)
 *  - Composed recipes (card-rest, card-hover, hero, glass, orb)
 *
 * Always use the composed recipes from components. Raw shadows below
 * are building blocks.
 */

:root {
  /* ──────────────────────────────────────────────────────────────
   * Raw ambient drop shadows (warm-tinted, diffused)
   * ────────────────────────────────────────────────────────────── */
  --shadow-xs:
    0 1px 2px rgba(46, 44, 39, 0.04);

  --shadow-sm:
    0 1px 2px rgba(46, 44, 39, 0.04),
    0 2px 6px rgba(46, 44, 39, 0.05);

  --shadow-md:
    0 2px 4px rgba(46, 44, 39, 0.04),
    0 8px 18px rgba(46, 44, 39, 0.07);

  --shadow-lg:
    0 4px 8px rgba(46, 44, 39, 0.05),
    0 16px 36px rgba(46, 44, 39, 0.09);

  --shadow-xl:
    0 8px 16px rgba(46, 44, 39, 0.06),
    0 28px 60px rgba(46, 44, 39, 0.12);

  --shadow-2xl:
    0 16px 32px rgba(46, 44, 39, 0.08),
    0 48px 96px rgba(46, 44, 39, 0.18);

  /* ──────────────────────────────────────────────────────────────
   * Inset highlights — top-edge shimmer that suggests sculpted depth.
   * Always combine with a drop shadow for full effect.
   * ────────────────────────────────────────────────────────────── */
  --inset-hi-top:
    inset 0 1px 0 rgba(255, 255, 255, 0.9);

  --inset-hi-top-strong:
    inset 0 1px 0 rgba(255, 255, 255, 1),
    inset 0 -1px 0 rgba(0, 0, 0, 0.04);

  --inset-hi-glass:
    inset 0 1px 0 rgba(255, 255, 255, 0.65),
    inset 0 0 0 1px rgba(255, 255, 255, 0.18);

  --inset-hi-dark:
    inset 0 1px 0 rgba(255, 255, 255, 0.10),
    inset 0 -1px 0 rgba(0, 0, 0, 0.4);

  /* Press / sunken — looks pushed in */
  --inset-press:
    inset 0 1px 3px rgba(46, 44, 39, 0.12),
    inset 0 0 0 1px rgba(0, 0, 0, 0.04);

  --inset-press-dark:
    inset 0 1px 4px rgba(0, 0, 0, 0.5),
    inset 0 0 0 1px rgba(255, 255, 255, 0.06);

  /* ──────────────────────────────────────────────────────────────
   * Glow shadows — colored ambient halos
   * Used on hero cards and active orb states.
   * ────────────────────────────────────────────────────────────── */
  --glow-brand:
    0 8px 24px rgba(59, 87, 240, 0.28),
    0 2px 6px rgba(59, 87, 240, 0.18);

  --glow-success:
    0 8px 24px rgba(26, 182, 104, 0.24),
    0 2px 6px rgba(26, 182, 104, 0.14);

  --glow-warning:
    0 8px 24px rgba(240, 165, 33, 0.24),
    0 2px 6px rgba(240, 165, 33, 0.14);

  --glow-danger:
    0 8px 24px rgba(240, 68, 56, 0.24),
    0 2px 6px rgba(240, 68, 56, 0.14);

  /* ──────────────────────────────────────────────────────────────
   * COMPOSED RECIPES — use these from components
   * ────────────────────────────────────────────────────────────── */

  /* Cards — soft floating surfaces */
  --shadow-card:
    0 1px 2px rgba(46, 44, 39, 0.04),
    0 8px 18px rgba(46, 44, 39, 0.06),
    inset 0 1px 0 rgba(255, 255, 255, 0.6);

  --shadow-card-hover:
    0 2px 4px rgba(46, 44, 39, 0.06),
    0 16px 32px rgba(46, 44, 39, 0.10),
    inset 0 1px 0 rgba(255, 255, 255, 0.7);

  /* Hero cards — gradient-mesh surfaces with bright halo */
  --shadow-hero:
    0 12px 32px rgba(46, 44, 39, 0.18),
    0 2px 8px rgba(46, 44, 39, 0.10),
    inset 0 1px 0 rgba(255, 255, 255, 0.32),
    inset 0 -1px 0 rgba(0, 0, 0, 0.10);

  /* Glass surfaces — frosted */
  --shadow-glass:
    0 8px 28px rgba(46, 44, 39, 0.10),
    0 1px 2px rgba(46, 44, 39, 0.04),
    inset 0 1px 0 rgba(255, 255, 255, 0.55),
    inset 0 0 0 1px rgba(255, 255, 255, 0.18);

  --shadow-glass-dark:
    0 8px 28px rgba(0, 0, 0, 0.4),
    0 1px 2px rgba(0, 0, 0, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    inset 0 0 0 1px rgba(255, 255, 255, 0.08);

  /* Buttons */
  --shadow-button-light:
    0 1px 2px rgba(46, 44, 39, 0.05),
    0 2px 6px rgba(46, 44, 39, 0.07),
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    inset 0 -1px 0 rgba(0, 0, 0, 0.04);

  --shadow-button-dark:
    0 1px 2px rgba(0, 0, 0, 0.3),
    0 4px 12px rgba(0, 0, 0, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    inset 0 -1px 0 rgba(0, 0, 0, 0.4);

  --shadow-button-brand:
    0 1px 2px rgba(46, 44, 39, 0.06),
    0 6px 14px rgba(59, 87, 240, 0.32),
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    inset 0 -1px 0 rgba(0, 0, 0, 0.18);

  --shadow-button-press:
    inset 0 2px 4px rgba(0, 0, 0, 0.12),
    inset 0 0 0 1px rgba(0, 0, 0, 0.06);

  /* Orb — 3D sphere shadow recipe (ambient halo + tight contact) */
  --shadow-orb-sm:
    0 2px 4px rgba(0, 0, 0, 0.12),
    0 4px 8px rgba(0, 0, 0, 0.08);

  --shadow-orb-md:
    0 4px 8px rgba(0, 0, 0, 0.14),
    0 8px 24px rgba(0, 0, 0, 0.12);

  --shadow-orb-lg:
    0 8px 16px rgba(0, 0, 0, 0.16),
    0 24px 48px rgba(0, 0, 0, 0.18);

  /* Floating action / hero CTAs */
  --shadow-fab:
    0 4px 8px rgba(46, 44, 39, 0.12),
    0 16px 32px rgba(46, 44, 39, 0.18);

  /* Bar elevation (sidebar, topbar) — hairline only */
  --shadow-bar:
    0 1px 0 0 var(--border-subtle);

  /* Focus ring */
  --ring-focus:    0 0 0 4px rgba(59, 87, 240, 0.18);
  --ring-selected: 0 0 0 2px var(--brand-500);
  --ring-danger:   0 0 0 4px rgba(240, 68, 56, 0.18);
}

/* Glass — frosted surface recipes.
 *
 * Tokens for iOS 26/27 Liquid Glass-style surfaces. Use these on
 * elements that sit ON TOP OF colorful or photographic content.
 * Glass over plain white is wasted — always pair with a tinted backdrop.
 *
 * Usage pattern:
 *   .glass {
 *     background: var(--glass-light-bg);
 *     backdrop-filter: var(--glass-blur-md);
 *     -webkit-backdrop-filter: var(--glass-blur-md);
 *     box-shadow: var(--shadow-glass);
 *     border: 1px solid var(--glass-light-border);
 *   }
 */

:root {
  /* ──────────────────────────────────────────────────────────────
   * Backdrop filters — blur + saturation boost
   * Saturation > 1 keeps colored bgs lively under the glass.
   * ────────────────────────────────────────────────────────────── */
  --glass-blur-xs: blur(8px)  saturate(1.4); /* @kind other */
  --glass-blur-sm: blur(12px) saturate(1.5); /* @kind other */
  --glass-blur-md: blur(20px) saturate(1.6); /* @kind other */
  --glass-blur-lg: blur(32px) saturate(1.8); /* @kind other */
  --glass-blur-xl: blur(48px) saturate(1.8); /* @kind other */

  /* ──────────────────────────────────────────────────────────────
   * Glass backgrounds — RGBA tints
   *
   * "light"  → for use over colored/dark backgrounds, frosted white
   * "dark"   → for use over light backgrounds, frosted ink
   * "warm"   → cream-tinted glass (subtle, for sidebar over cream page)
   * ────────────────────────────────────────────────────────────── */

  /* Light glass — frosted white */
  --glass-light-bg:        rgba(255, 255, 255, 0.55);
  --glass-light-bg-soft:   rgba(255, 255, 255, 0.42);
  --glass-light-bg-strong: rgba(255, 255, 255, 0.72);
  --glass-light-border:    rgba(255, 255, 255, 0.7);
  --glass-light-divider:   rgba(255, 255, 255, 0.25);

  /* Dark glass — frosted ink */
  --glass-dark-bg:         rgba(20, 20, 24, 0.55);
  --glass-dark-bg-soft:    rgba(20, 20, 24, 0.40);
  --glass-dark-bg-strong:  rgba(20, 20, 24, 0.75);
  --glass-dark-border:     rgba(255, 255, 255, 0.12);
  --glass-dark-divider:    rgba(255, 255, 255, 0.08);

  /* Warm glass — for sidebar/topbar over cream page */
  --glass-warm-bg:         rgba(251, 250, 247, 0.72);
  --glass-warm-bg-strong:  rgba(251, 250, 247, 0.86);
  --glass-warm-border:     rgba(46, 44, 39, 0.06);

  /* ──────────────────────────────────────────────────────────────
   * Inset highlight recipes — give glass surfaces their sculpted feel
   * ────────────────────────────────────────────────────────────── */
  --glass-inset-light:
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    inset 0 0 0 1px rgba(255, 255, 255, 0.18);

  --glass-inset-dark:
    inset 0 1px 0 rgba(255, 255, 255, 0.12),
    inset 0 0 0 1px rgba(255, 255, 255, 0.06);

  /* ──────────────────────────────────────────────────────────────
   * Composed glass surfaces — one-shot tokens
   * ────────────────────────────────────────────────────────────── */

  /* Sidebar / topbar that sit over the page bg */
  --glass-bar-light:        rgba(251, 250, 247, 0.78);
  --glass-bar-dark:         rgba(14, 14, 16, 0.78);

  /* Modal / sheet backdrops (overlay under glass dialog) */
  --glass-backdrop:         rgba(14, 14, 16, 0.32);
  --glass-backdrop-strong:  rgba(14, 14, 16, 0.5);

  /* Pill button glass — for "ghost" actions */
  --glass-pill-light-bg:    rgba(255, 255, 255, 0.6);
  --glass-pill-light-hover: rgba(255, 255, 255, 0.8);
  --glass-pill-dark-bg:     rgba(255, 255, 255, 0.10);
  --glass-pill-dark-hover:  rgba(255, 255, 255, 0.18);

  /* Tint overlays — add a color wash UNDER the blur (set as background-image) */
  --glass-tint-cool: radial-gradient(at 20% 20%, rgba(140, 170, 255, 0.35) 0%, transparent 60%);
  --glass-tint-warm: radial-gradient(at 30% 30%, rgba(255, 200, 160, 0.30) 0%, transparent 60%);
  --glass-tint-aurora: radial-gradient(at 30% 20%, rgba(195, 160, 255, 0.30) 0%, transparent 60%);
}

/* ──────────────────────────────────────────────────────────────
 * Browser fallback — when backdrop-filter is unsupported,
 * fall back to opaque surfaces so content remains legible.
 * ────────────────────────────────────────────────────────────── */
@supports not (backdrop-filter: blur(1px)) {
  :root {
    --glass-light-bg:        rgba(255, 255, 255, 0.96);
    --glass-light-bg-soft:   rgba(255, 255, 255, 0.92);
    --glass-light-bg-strong: rgba(255, 255, 255, 0.98);
    --glass-dark-bg:         rgba(20, 20, 24, 0.96);
    --glass-warm-bg:         rgba(251, 250, 247, 0.96);
    --glass-bar-light:       rgba(251, 250, 247, 0.96);
    --glass-bar-dark:        rgba(14, 14, 16, 0.96);
  }
}

/* Motion.
 *
 * Fast, snappy, Apple-flavored easing. Most UI transitions
 * sit in the 120–180ms range — long enough to be felt, short
 * enough to disappear when you're moving fast.
 *
 * Avoid bounce/spring easing in workflow UIs — it slows users down.
 * Reserve longer durations for modals and toasts only.
 */

:root {
  /* Durations */
  --dur-instant: 80ms;   /* @kind other */
  --dur-fast:    120ms;  /* @kind other */
  --dur-base:    180ms;  /* @kind other */
  --dur-slow:    240ms;  /* @kind other */
  --dur-modal:   320ms;  /* @kind other */

  /* Easings */
  --ease-out:        cubic-bezier(0.2, 0.8, 0.2, 1);  /* @kind other */
  --ease-in-out:     cubic-bezier(0.4, 0, 0.2, 1);  /* @kind other */
  --ease-in:         cubic-bezier(0.4, 0, 1, 1);  /* @kind other */
  --ease-emphasized: cubic-bezier(0.2, 0, 0, 1);  /* @kind other */

  /* Composed (shorthand for common patterns) */
  --transition-base:  all var(--dur-base) var(--ease-out);  /* @kind other */

    --dur-fast:    0ms;  /* @kind other */
    --dur-base:    0ms;  /* @kind other */

  { key: "spotlight-button", num: "410", name: "Spotlight Button", ar: "زر البقعة الضوئيّة", status: "ready", category: "Button · cursor-follow", origin: "waleedkibhen", concept: "هالة ضوء دائرية تتبع المؤشّر داخل الزر عبر onMouseMove.", where: "أزرار CTA داكنة تحتاج لمسة تفاعل خفيّة." },
  { key: "liquid-glass-v2", num: "411", name: "Liquid Glass (v2)", ar: "زجاج سائل — نسخة ثانية", status: "ready", category: "Display · droplet glass", origin: "suraj-xd", concept: "كبسولة زجاجيّة بيضاوية الشكل بملمس مزدوج (فاتح أعلى/داكن أسفل) تعطي إحساس قطرة منتفخة — أكثر تقوسًا من LiquidGlass الأصلي.", where: "بديل بصري للزجاج الأصلي في أي مشروع." },
  { key: "flow-hover-button", num: "412", name: "Flow Hover Button", ar: "زر التدفّق المستمر", status: "ready", category: "Button · animated gradient", origin: "vaib215", concept: "تدرّج أفقي ثلاثي الألوان يتدفّق باستمرار عبر background-position.", where: "CTA بصري حيّ بدون الحاجة لتفاعل ماوس." },

  { key: "animated-radio", num: "414", name: "Animated Radio", ar: "راديو متحرّك", status: "ready", category: "Form · sliding segmented", origin: "jatin-yadav05", concept: "مؤشّر أبيض ينزلق بين الأزرار بقياس offsetLeft/offsetWidth من refs. مختلف عن LiquidRadio/OrbRadioSelector.", where: "مجموعة اختيار قصيرة من 3-4 خيارات متساوية." },
];

const STATUS = {
  ok:    { cls: "ok",    label: "مطبّق في النظام" },
  ready: { cls: "ready", label: "جاهز للإضافة — الكود هنا" },
  ref:   { cls: "ref",   label: "مرجعي · لإعادة التوظيف" },
};

function CopyBtn({ text }) {
  const [state, setState] = React.useState("idle"); // idle | done | failed
  return (
    <button className="code__copy" onClick={() => {
      const ok = () => { setState("done"); setTimeout(() => setState("idle"), 1400); };
      const fail = () => { setState("failed"); setTimeout(() => setState("idle"), 1400); };
      try {
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(text).then(ok).catch(fail);
        } else {
          fail();
        }
      } catch (e) { fail(); }
    }}>{state === "done" ? "✓ نُسخ" : state === "failed" ? "تعذّر النسخ" : "نسخ"}</button>
  );
}

function CodeViewer({ usage, source }) {
  const [tab, setTab] = React.useState("usage");
  const text = tab === "usage" ? usage : source;
  return (
    <div className="code">
      <div className="code__bar">
        <button className={"code__tab" + (tab === "usage" ? " code__tab--active" : "")} onClick={() => setTab("usage")}>الاستخدام</button>
        <button className={"code__tab" + (tab === "source" ? " code__tab--active" : "")} onClick={() => setTab("source")}>الكود الكامل</button>
        <CopyBtn text={text} />
      </div>
      <pre>{text}</pre>
    </div>
  );
}

function PatternDetail({ meta }) {
  const reg = (window.JAHEZ_PATTERNS || {})[meta.key] || {};
  const Demo = reg.Demo;
  const st = STATUS[meta.status];
  return (
    <div>
      <div className="pat__head">
        <span className="pat__num">{meta.num}</span>
        <div className="pat__titles">
          <div className="pat__name">{meta.name}</div>
          <div className="pat__ar">{meta.ar}</div>
        </div>
        <span className={"badge badge--" + st.cls}>
          <span className={"dot dot--" + st.cls}></span>{st.label}
        </span>
      </div>

      <div className="meta-row">
        <span className="chip">{meta.category}</span>
        <span className="chip">21st.dev/{meta.origin}</span>
      </div>

      <div className="sec">
        <div className="sec__label">الفكرة · التحليل</div>
        <p className="prose" dangerouslySetInnerHTML={{ __html: meta.concept }} />
      </div>

      <div className="sec">
        <div className="sec__label">معاينة حية</div>
        <div className="demo">{Demo ? <Demo /> : <em style={{ color: "var(--text-tertiary)" }}>جارٍ التحميل…</em>}</div>
      </div>

      <div className="sec">
        <div className="sec__label">الكود</div>
        <CodeViewer usage={reg.usage || "// —"} source={reg.source || "// —"} />
      </div>

      <div className="where">
        <span className="where__icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2 4 7v10l8 5 8-5V7Z"/><path d="m4 7 8 5 8-5"/><path d="M12 22V12"/></svg>
        </span>
        <div className="where__t" dangerouslySetInnerHTML={{ __html: "<b>أين يُستخدم في جاهز:</b> " + meta.where }} />
      </div>
    </div>
  );
}

function App() {
  const [sel, setSel] = React.useState(META[0].key);
  const ALL = React.useMemo(function () { return META.concat(window.JAHEZ_META_2 || []); }, []);
  const current = ALL.find(m => m.key === sel);
  const groups = [
    { label: "مطبّق في النظام", items: ALL.filter(m => m.status === "ok") },
    { label: "جاهز للإضافة", items: ALL.filter(m => m.status === "ready") },
    { label: "مرجعي", items: ALL.filter(m => m.status === "ref") },
  ];

  return (
    <div className="layout">
      <aside className="side">
        <div className="brand">
          <img className="brand__mark" src="../assets/logo/symbol.svg" alt="" />
          <div>
            <div className="brand__t">مكتبة الأنماط</div>
            <div className="brand__s">21st.dev → Jahez · {ALL.length} نمط</div>
          </div>
        </div>
        {groups.map(g => (
          <div key={g.label}>
            <div className="side__group">{g.label} · {g.items.length}</div>
            {g.items.map(m => (
              <button key={m.key} className={"navitem" + (m.key === sel ? " navitem--active" : "")} onClick={() => setSel(m.key)}>
                <span className="navitem__num">{m.num}</span>
                <span className={"dot dot--" + STATUS[m.status].cls}></span>
                <span className="navitem__t">{m.ar}</span>
              </button>
            ))}
          </div>
        ))}
      </aside>

      <main className="main">
        <div className="wrap">
          <div className="intro">
            <h1>مكتبة الأنماط المرجعية</h1>
            <p>تحليل كامل لكل نمط من المصادر المرجعية — الفكرة، معاينة حية، والكود الجاهز للنسخ. كل نمط مكتفٍ ذاتيًا: انسخ الكود وطبّقه مباشرةً دون الحاجة للرابط الأصلي.</p>
            <p style={{ marginTop: 8, fontSize: 14, color: "var(--text-tertiary)" }}>الكود في تبويب «الكود الكامل» مكتوب بقيم خام محمولة (ألوان وخطوط مباشرة، بلا متغيّرات جاهز) — صالح للنسخ إلى أي مشروع آخر. أما المعاينات الحيّة فتستخدم مكوّنات جاهز حيث توفّرت.</p>
            <div className="legend">
              <span><span className="dot dot--ok"></span>مطبّق في النظام</span>
              <span><span className="dot dot--ready"></span>جاهز للإضافة — الكود هنا</span>
              <span><span className="dot dot--ref"></span>مرجعي · لإعادة التوظيف</span>
            </div>
          </div>
          {current && <PatternDetail meta={current} />}
        </div>
      </main>
    </div>
  );
}

function mount() {
  if (!window.JAHEZ_PATTERNS) return setTimeout(mount, 40);
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
mount();
</script>


</body></html>
