name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4

      # A green deploy step is not proof the site works. If Pages is still set
      # to "Deploy from a branch", this job succeeds while the live URL serves
      # the repository root — an index.html pointing at `/src/main.tsx`, which
      # renders blank. Fetch the deployed page and insist it is the build.
      - name: Verify the deployed page is the build
        run: |
          for i in 1 2 3 4 5 6; do
            html=$(curl -fsSL "${{ steps.deploy.outputs.page_url }}" || true)
            case "$html" in
              *'./assets/'*) echo "Live page serves the build."; exit 0 ;;
            esac
            echo "Attempt $i: not the build yet, waiting for the CDN."
            sleep 10
          done
          echo "::error::${{ steps.deploy.outputs.page_url }} is not serving dist/."
          echo "::error::Set Settings -> Pages -> Source to 'GitHub Actions'."
          exit 1
