<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design Showcase 05/08 — product card study</title>
<!--
  A faithful replica of the reference the owner supplied, built to the letter:
  the bevels, the inner glows, the gradients, the sphere swatches, the soft drop
  shadows, the 56px radii, the emoji and the urgency banner.

  It lives in `studies/` and not in `src/` on purpose. Every one of those is
  banned by the `anti-slop-ui` skill installed in this repo and by the owner's
  own rulings recorded in design-system/VISUAL-LAW.md §1 and §3 — no blurred
  drop shadows, radii capped at 6px, solid surfaces with `g0` as the default.
  Putting this file inside the library would turn eleven passing harnesses red
  and make the law a thing the repo claims rather than a thing it keeps. So the
  replica is exact and the quarantine is exact too; studies/README.md records
  which prohibition each piece of it breaks.

  Two deliberate deviations, both stated rather than hidden:
  · the photographed sneaker cannot be reproduced, so it is drawn in SVG with
    the same silhouette and colour blocking;
  · the swoosh is a registered trademark and is not drawn — the side panel is
    the plain white shape the mark would sit on.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: #eeeeee;
    /* Liberation Sans is the Helvetica/Arial metric clone available here, which
       is the closest match to the reference's grotesk. */
    font-family: 'Helvetica Neue', Helvetica, 'Liberation Sans', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* ── the frame ─────────────────────────────────────────────────────────── */
  .board {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #eeeeee;
    overflow: hidden;
  }

  .meta {
    position: absolute;
    inset-inline: 44px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 20.5px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: #121212;
  }
  .meta--top { top: 46px; }
  .meta--bottom { bottom: 42px; }

  /* ── the card ──────────────────────────────────────────────────────────── */
  .card {
    position: absolute;
    left: 163px;
    top: 262px;
    width: 754px;
    /* the whole object's drop shadow: wide, soft, offset down */
    filter:
      drop-shadow(0 26px 42px rgba(15, 18, 30, 0.14))
      drop-shadow(0 6px 14px rgba(15, 18, 30, 0.06));
  }

  /* The blue sheet is the full card, and the white panel sits on it — which is
     what makes the blue read as a second surface *behind* rather than a stripe
     appended below. */
  .sheet {
    position: absolute;
    inset: 0;
    border-radius: 56px;
    background: linear-gradient(180deg, #3159ea 0%, #2a4fe2 46%, #1e3ecd 100%);
    /* bevel: a lit top lip, a dark bottom lip, and faint lit sides */
    box-shadow:
      inset 0 1.5px 0 rgba(255, 255, 255, 0.42),
      inset 0 -2px 0 rgba(6, 20, 84, 0.45),
      inset 1.5px 0 0 rgba(255, 255, 255, 0.16),
      inset -1.5px 0 0 rgba(255, 255, 255, 0.16);
  }

  .banner {
    position: absolute;
    inset-inline: 0;
    bottom: 0;
    height: 106px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: #ffffff;
    font-size: 25.5px;
    font-weight: 500;
    letter-spacing: -0.005em;
    /* inner glow along the seam where the white panel meets the blue */
    text-shadow: 0 1px 0 rgba(8, 24, 96, 0.28);
  }
  .banner .flame {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    font-size: 21px;
    line-height: 1;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.5),
      inset 0 -1px 0 rgba(6, 20, 84, 0.25);
    font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    padding-block-start: 2px;
  }

  .panel {
    position: relative;
    z-index: 1;
    margin-bottom: 106px;
    border-radius: 56px 56px 48px 48px;
    background: linear-gradient(180deg, #fbfbfb 0%, #f4f4f4 100%);
    box-shadow:
      inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
      inset 0 -1px 0 rgba(0, 0, 0, 0.05),
      0 1px 0 rgba(0, 0, 0, 0.04);
  }

  /* ── image zone ────────────────────────────────────────────────────────── */
  .stage {
    position: relative;
    height: 383px;
    border-radius: 56px 56px 44px 44px;
    /* the grey is a gradient with a lit pool behind the product: that pool is
       the whole reason the shoe reads as lifted off the surface */
    background:
      radial-gradient(58% 48% at 50% 40%, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0) 72%),
      linear-gradient(168deg, #e9e9e9 0%, #e2e2e2 42%, #d7d7d7 100%);
    box-shadow:
      inset 0 1.5px 0 rgba(255, 255, 255, 0.8),
      inset 0 -1.5px 0 rgba(0, 0, 0, 0.055),
      inset 1px 0 0 rgba(255, 255, 255, 0.35),
      inset -1px 0 0 rgba(255, 255, 255, 0.35);
    overflow: hidden;
  }

  .chip-btn {
    position: absolute;
    top: 30px;
    width: 64px;
    height: 64px;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.24));
    backdrop-filter: blur(6px);
    box-shadow:
      inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
      inset 0 -1.5px 0 rgba(0, 0, 0, 0.06),
      0 2px 6px rgba(0, 0, 0, 0.05);
  }
  .chip-btn--expand { left: 30px; }
  .chip-btn--heart { right: 30px; }

  .price {
    position: absolute;
    right: 26px;
    bottom: 26px;
    height: 48px;
    padding: 0 23px;
    display: flex;
    align-items: center;
    border-radius: 24px;
    background: linear-gradient(180deg, #ffffff, #f7f7f7);
    color: #141414;
    font-size: 20.5px;
    font-weight: 500;
    letter-spacing: -0.005em;
    box-shadow:
      inset 0 1.5px 0 rgba(255, 255, 255, 1),
      inset 0 -1px 0 rgba(0, 0, 0, 0.05),
      0 6px 14px rgba(0, 0, 0, 0.1),
      0 1px 3px rgba(0, 0, 0, 0.06);
  }

  .shoe {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 500px;
    transform: translate(-50%, -52%) rotate(-3deg);
    /* the product's own contact shadow on the grey plinth */
    filter: drop-shadow(0 20px 18px rgba(20, 30, 70, 0.2));
  }

  /* ── body ──────────────────────────────────────────────────────────────── */
  .body {
    padding: 34px 22px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .titlerow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  h1 {
    margin: 0;
    font-size: 45px;
    font-weight: 700;
    letter-spacing: -0.031em;
    color: #0b0b0b;
    line-height: 1;
  }

  .swatches { display: flex; align-items: center; gap: 13px; }

  /* Each swatch is a lit sphere, not a flat dot: a highlight offset to the
     upper-left, a terminator, and a bounce along the lower edge. */
  .sw {
    width: 47px;
    height: 47px;
    border: 0;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
  }
  .sw--black {
    background:
      radial-gradient(66% 66% at 33% 26%, #7c7c7c 0%, #2c2c2c 44%, #0a0a0a 78%),
      #000;
    box-shadow:
      inset 0 -2px 3px rgba(255, 255, 255, 0.22),
      0 3px 7px rgba(0, 0, 0, 0.26);
  }
  .sw--white {
    background:
      radial-gradient(66% 66% at 33% 26%, #ffffff 0%, #f1f4f9 40%, #d3dae5 84%),
      #e9edf3;
    box-shadow:
      inset 0 -2px 3px rgba(255, 255, 255, 0.9),
      inset 0 0 0 1px rgba(120, 132, 152, 0.16),
      0 3px 7px rgba(30, 40, 70, 0.14);
  }
  .sw--blue {
    background:
      radial-gradient(66% 66% at 33% 26%, #9db6ff 0%, #3b62ee 42%, #1c3ccb 82%),
      #2c51e6;
    /* the selected one: a white gap, then a soft coloured halo */
    box-shadow:
      inset 0 -2px 3px rgba(255, 255, 255, 0.34),
      0 0 0 4.5px #f6f6f6,
      0 0 0 7px rgba(44, 81, 230, 0.34),
      0 4px 12px rgba(44, 81, 230, 0.36);
  }

  /* ── pills ─────────────────────────────────────────────────────────────── */
  .pills { display: flex; gap: 15px; }

  .pill {
    height: 60px;
    padding: 0 26px;
    display: flex;
    align-items: center;
    gap: 13px;
    border-radius: 30px;
    background: linear-gradient(180deg, #f4f4f4, #ececec);
    color: #171717;
    font-size: 21.5px;
    font-weight: 400;
    letter-spacing: -0.008em;
    box-shadow:
      inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
      inset 0 -1.5px 0 rgba(0, 0, 0, 0.045),
      inset 0 0 0 1px rgba(0, 0, 0, 0.014);
  }

  .more {
    padding: 4px 11px 5px;
    border-radius: 14px;
    background: linear-gradient(180deg, #e2e2e2, #d9d9d9);
    color: #4a4a4a;
    font-size: 17.5px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.7),
      inset 0 -1px 0 rgba(0, 0, 0, 0.05);
  }

  /* ── stepper + action ──────────────────────────────────────────────────── */
  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }

  .stepper {
    height: 66px;
    width: 234px;
    padding: 0 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 33px;
    background: linear-gradient(180deg, #f2f2f2, #e9e9e9);
    box-shadow:
      inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
      inset 0 -1.5px 0 rgba(0, 0, 0, 0.05),
      inset 0 0 0 1px rgba(0, 0, 0, 0.014);
  }

  .step {
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    font-size: 25px;
    font-weight: 400;
    color: #6d6d6d;
    line-height: 1;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, #fcfcfc, #f3f3f3);
    box-shadow:
      inset 0 1.5px 0 rgba(255, 255, 255, 1),
      inset 0 -1px 0 rgba(0, 0, 0, 0.05),
      0 1px 3px rgba(0, 0, 0, 0.05);
  }

  .count {
    font-size: 27px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: #131313;
    font-variant-numeric: tabular-nums;
  }

  .cart {
    height: 66px;
    width: 234px;
    border: 0;
    border-radius: 33px;
    cursor: pointer;
    color: #ffffff;
    font-size: 25px;
    font-weight: 500;
    letter-spacing: -0.014em;
    font-family: inherit;
    background: linear-gradient(180deg, #262626 0%, #101010 52%, #050505 100%);
    box-shadow:
      inset 0 1.5px 0 rgba(255, 255, 255, 0.24),
      inset 0 -1.5px 0 rgba(0, 0, 0, 0.6),
      0 10px 22px rgba(0, 0, 0, 0.3),
      0 2px 6px rgba(0, 0, 0, 0.2);
  }
</style>
</head>
<body>
<div class="board">
  <div class="meta meta--top"><span>Design Showcase</span><span>05/08</span></div>

  <div class="card">
    <div class="sheet">
      <div class="banner"><span class="flame">🔥</span>Limited Time Offer</div>
    </div>

    <div class="panel">
      <div class="stage">
        <button class="chip-btn chip-btn--expand" aria-label="Expand">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f7f7f7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5V9"/>
            <path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9"/>
            <path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"/>
            <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20H9"/>
          </svg>
        </button>

        <button class="chip-btn chip-btn--heart" aria-label="Save">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="#111111">
            <path d="M12 20.4s-7.6-4.7-7.6-9.9a4.4 4.4 0 0 1 7.6-3 4.4 4.4 0 0 1 7.6 3c0 5.2-7.6 9.9-7.6 9.9z"/>
          </svg>
        </button>

        <!-- The photograph cannot be reproduced, so the product is drawn: same
             silhouette, same colour blocking, same white midsole and blue
             outsole. The swoosh is a trademark and is deliberately not drawn —
             the white side panel is the shape it would sit on. -->
        <!-- The product in the reference is a PHOTOGRAPH of a real shoe. A
             photograph cannot be reproduced in vector, and six attempts at
             drawing one proved it: what follows is an honest flat-vector stand-in
             with the reference's silhouette and colour blocking, not a copy of
             the image. To use the real thing, delete this <svg> and put an <img
             class="shoe" src="shoe.png" alt=""> in its place — the class already
             carries the position, the scale and the contact shadow.
             The swoosh is a trademark and is deliberately not drawn. -->
        <svg class="shoe" viewBox="0 0 460 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="upper" x1="0.15" y1="0" x2="0.4" y2="1">
              <stop offset="0" stop-color="#4a6ef3"/>
              <stop offset="0.4" stop-color="#2b51e4"/>
              <stop offset="1" stop-color="#1c37b6"/>
            </linearGradient>
            <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="0.55" stop-color="#fbfcfd"/>
              <stop offset="1" stop-color="#e2e6ed"/>
            </linearGradient>
            <linearGradient id="out" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3c62ee"/>
              <stop offset="1" stop-color="#1c3bc0"/>
            </linearGradient>
            <clipPath id="cu"><path d="M22 138 C20 116 24 96 40 84 C54 74 84 68 120 64 C152 61 186 58 214 54 C220 40 228 28 240 26 C250 24 254 34 252 46 C251 52 249 56 246 60 C256 44 272 30 292 24 C318 16 350 14 376 18 C398 22 414 40 422 66 C430 92 432 118 432 138 Z"/></clipPath>
          </defs>

          <!-- outsole -->
          <path d="M26 170 L430 170 C443 170 452 176 452 181 C452 187 443 191 430 191 L26 191 C13 191 4 187 4 181 C4 175 13 170 26 170 Z" fill="url(#out)"/>
          <!-- midsole -->
          <path d="M22 136 L434 136 C447 136 454 144 454 154 C454 166 445 172 432 172 L24 172 C11 172 2 166 2 154 C2 143 9 137 22 136 Z" fill="url(#mid)"/>
          <path d="M22 136 L434 136 C447 136 454 144 454 154 L2 154 C2 143 9 137 22 136 Z" fill="#ffffff"/>
          <path d="M6 160h444" stroke="#d7dce4" stroke-width="1.6"/>
          <path d="M300 148h44M354 148h48M406 148h40" stroke="#e1e5ec" stroke-width="4" stroke-linecap="round"/>

          <!-- upper -->
          <path d="M22 138 C20 116 24 96 40 84 C54 74 84 68 120 64 C152 61 186 58 214 54 C220 40 228 28 240 26 C250 24 254 34 252 46 C251 52 249 56 246 60 C256 44 272 30 292 24 C318 16 350 14 376 18 C398 22 414 40 422 66 C430 92 432 118 432 138 Z" fill="url(#upper)"/>
          <g clip-path="url(#cu)">
            <!-- toe box, one shade up, ending where the vamp begins -->
            <path d="M0 150 C0 108 22 84 64 72 C88 65 110 62 132 60 L132 150 Z" fill="#3d62f0"/>
            <!-- heel counter, one shade down -->
            <path d="M382 18 C404 26 420 46 428 74 C434 96 434 122 432 150 L376 150 L376 18 Z" fill="#1c35a8"/>
            <!-- the ankle opening, sunk into the collar -->
            <path d="M268 44 C292 32 322 26 350 26 C372 26 388 32 396 44 C402 53 396 60 382 60 C356 60 316 54 288 48 C276 46 269 46 268 44 Z" fill="#16308f"/>
            <!-- perforations across the toe -->
            <g fill="#ffffff" opacity="0.55">
              <circle cx="58" cy="100" r="2.4"/><circle cx="78" cy="94" r="2.4"/><circle cx="98" cy="89" r="2.4"/>
              <circle cx="60" cy="114" r="2.4"/><circle cx="80" cy="108" r="2.4"/><circle cx="100" cy="103" r="2.4"/>
            </g>
            <!-- one light, from above -->
            <path d="M22 138 C20 116 24 96 40 84 C54 74 84 68 120 64 C152 61 186 58 214 54 C220 40 228 28 240 26 C250 24 254 34 252 46 C251 52 249 56 246 60 C256 44 272 30 292 24 C318 16 350 14 376 18 C398 22 414 40 422 66 C430 92 432 118 432 138 Z" fill="none" stroke="#a4b8ff" stroke-width="4" opacity="0.5"/>
            <!-- the seam where the upper meets the midsole -->
            <path d="M0 134h460" stroke="#152c93" stroke-width="2.5" opacity="0.28"/>
          </g>

          <!-- laces across the throat, on the vamp's own slope -->
          <g fill="#f8f9fc" transform="rotate(-8 208 76)">
            <rect x="176" y="86" width="62" height="8" rx="4"/>
            <rect x="186" y="72" width="58" height="8" rx="4"/>
            <rect x="198" y="58" width="50" height="8" rx="4"/>
            <rect x="212" y="44" width="38" height="8" rx="4"/>
          </g>

          <!-- the hanging tag -->
          <g transform="rotate(-84 268 104)">
            <rect x="244" y="97" width="48" height="15" rx="3" fill="#f5f3ed"/>
            <text x="249" y="108" font-family="'Liberation Sans', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#2b2b2b" letter-spacing="0.7">LACET</text>
          </g>

          <!-- the small green mark on the toe -->
          <rect x="110" y="106" width="21" height="9" rx="3" fill="#32d158"/>

          <!-- midsole lettering -->
          <path d="M46 150h18" stroke="#1f3fc6" stroke-width="1.8"/>
          <text x="70" y="154" font-family="'Liberation Sans', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f3fc6" letter-spacing="1.2">AIR</text>
          <text x="112" y="154" font-family="'Liberation Sans', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f3fc6" letter-spacing="1.2">"AIR"</text>
          <path d="M178 150h18" stroke="#1f3fc6" stroke-width="1.8"/>
        </svg>

        <div class="price">14&thinsp;990,99&nbsp;€</div>
      </div>

      <div class="body">
        <div class="titlerow">
          <h1>Nike Air Force 1</h1>
          <div class="swatches">
            <button class="sw sw--black" aria-label="Black"></button>
            <button class="sw sw--white" aria-label="White"></button>
            <button class="sw sw--blue" aria-label="Blue" aria-pressed="true"></button>
          </div>
        </div>

        <div class="pills">
          <div class="pill">10 / 11.5 W <span class="more">+20</span></div>
          <div class="pill">New <span class="more">+2</span></div>
          <div class="pill">LVAF1-BLUE</div>
        </div>

        <div class="actions">
          <div class="stepper">
            <button class="step" aria-label="Decrease">−</button>
            <span class="count">01</span>
            <button class="step" aria-label="Increase">+</button>
          </div>
          <button class="cart">Add to cart</button>
        </div>
      </div>
    </div>
  </div>

  <div class="meta meta--bottom"><span>@memento___studios</span><span>Save for later</span></div>
</div>
</body>
</html>
